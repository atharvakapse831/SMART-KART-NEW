<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Receipt - Smart KART</title>
    <!-- Import html2pdf library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #f3f4f6;
            padding: 2rem 0;
            min-height: 100vh;
        }

        .receipt-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 3rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        .receipt-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid #e5e7eb;
        }

        .company-info .logo {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-decoration: none;
        }

        .company-info .address {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .receipt-title {
            text-align: right;
        }

        .receipt-title h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .receipt-meta {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .receipt-meta span {
            display: block;
            margin-bottom: 0.25rem;
        }

        .billing-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3rem;
            gap: 2rem;
        }

        .bill-to h3,
        .bill-from h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .customer-details p {
            margin-bottom: 0.25rem;
            color: var(--text-main);
            font-weight: 500;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }

        .items-table th {
            text-align: left;
            padding: 1rem;
            background: #f9fafb;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            border-bottom: 2px solid #e5e7eb;
        }

        .items-table td {
            padding: 1rem;
            border-bottom: 1px solid #e5e7eb;
            color: var(--text-main);
        }

        .items-table td.col-price,
        .items-table td.col-total {
            text-align: right;
        }

        .summary-section {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 3rem;
        }

        .summary-table {
            width: 300px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            color: var(--text-muted);
        }

        .summary-row.total {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary-color);
            border-top: 2px solid #e5e7eb;
            margin-top: 0.5rem;
            padding-top: 1rem;
        }

        .receipt-footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding-top: 2rem;
            border-top: 1px solid #e5e7eb;
        }

        .action-bar {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 1rem 2rem;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-lg);
            display: flex;
            gap: 1rem;
            z-index: 100;
            border: 1px solid #e5e7eb;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem 0 6.5rem;
            }

            .receipt-container {
                padding: 1.5rem;
                border-radius: var(--radius-md);
            }

            .receipt-header,
            .billing-info {
                flex-direction: column;
            }

            .receipt-title {
                text-align: left;
            }

            .receipt-title h1 {
                font-size: 2rem;
                letter-spacing: 1px;
            }

            .summary-section {
                justify-content: stretch;
            }

            .summary-table {
                width: 100%;
            }

            .action-bar {
                left: 1rem;
                right: 1rem;
                bottom: 1rem;
                transform: none;
                border-radius: var(--radius-lg);
                padding: 0.75rem;
                gap: 0.75rem;
            }
        }

        @media (max-width: 480px) {
            .items-table th,
            .items-table td {
                padding: 0.75rem;
            }

            .action-bar {
                flex-direction: column;
            }

            .action-bar .btn {
                width: 100%;
            }
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }

            .receipt-container {
                box-shadow: none;
                padding: 0;
                width: 100%;
                max-width: none;
            }

            .action-bar {
                display: none !important;
            }

            .logo i {
                color: black !important;
            }

            .receipt-title h1 {
                color: black !important;
            }

            .summary-row.total {
                color: black !important;
            }
        }
    </style>
</head>

<body>
    <div id="receipt" class="receipt-container">
        <!-- Content will be loaded here -->
        <div style="text-align: center; padding: 2rem;">
            <i class="fas fa-spinner fa-spin fa-3x" style="color: var(--primary-color);"></i>
            <p style="margin-top: 1rem;">Loading receipt...</p>
        </div>
    </div>

    <div class="action-bar">
        <button onclick="window.location.href='index.html'" class="btn btn-outline">
            <i class="fas fa-home"></i> Home
        </button>
        <button onclick="window.print()" class="btn btn-primary">
            <i class="fas fa-print"></i> Print
        </button>
        <button onclick="downloadPDF()" class="btn btn-primary" style="background: var(--text-main);">
            <i class="fas fa-download"></i> Download PDF
        </button>
    </div>

    <!-- Required Scripts -->
    <script src="config.js"></script>
    <script src="api-service.js"></script>
    <script>
        // Check for Order ID
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');

        if (!orderId) {
            window.location.href = 'index.html';
        }

        async function loadReceipt() {
            try {
                const response = await apiService.getOrder(orderId);
                const order = response.data;
                renderReceipt(order);
            } catch (error) {
                console.error('Error loading receipt:', error);
                document.getElementById('receipt').innerHTML = `
                    <div style="text-align: center; padding: 3rem;">
                        <i class="fas fa-exclamation-circle fa-3x" style="color: var(--danger-color); margin-bottom: 1rem;"></i>
                        <h2>Order Not Found</h2>
                        <p>${error.message}</p>
                        <a href="index.html" class="btn btn-primary" style="margin-top: 1rem;">Return Home</a>
                    </div>
                `;
                document.querySelector('.action-bar').style.display = 'none';
            }
        }

        function renderReceipt(order) {
            const date = new Date(order.date).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

            // Calculate Subtotal and Tax (Assuming simplified tax logic for demo)
            const subtotal = order.total / 1.10; // Assuming ~10% tax included
            const tax = order.total - subtotal;

            let itemsHtml = order.items.map(item => `
                <tr>
                    <td>
                        <div style="font-weight: 600;">${item.product_name}</div>
                    </td>
                    <td style="text-align: center;">${item.quantity}</td>
                    <td class="col-price">$${item.price.toFixed(2)}</td>
                    <td class="col-total">$${(item.quantity * item.price).toFixed(2)}</td>
                </tr>
            `).join('');

            const html = `
                <div class="receipt-header">
                    <div class="company-info">
                        <a href="#" class="logo"><i class="fas fa-leaf"></i> Smart KART</a>
                        <div class="address" style="margin-top: 1rem;">
                            123 Create Avenue<br>
                            Tech City, TC 90210<br>
                            support@smartkart.com<br>
                            (555) 123-4567
                        </div>
                    </div>
                    <div class="receipt-title">
                        <h1>Receipt</h1>
                        <div class="receipt-meta">
                            <span>Receipt #: ORD-${String(order.id).padStart(6, '0')}</span>
                            <span>Date: ${date}</span>
                            <span>Status: <b style="color: var(--primary-color)">${order.status}</b></span>
                        </div>
                    </div>
                </div>

                <div class="billing-info">
                    <div class="bill-to">
                        <h3>Bill To:</h3>
                        <div class="customer-details">
                            <p>${order.user_name}</p>
                            <p>${order.email}</p>
                            <p>${order.address || 'No address provided'}</p>
                        </div>
                    </div>
                </div>

                <div class="table-scroll">
                    <table class="items-table">
                        <thead>
                            <tr>
                                <th style="width: 50%;">Item Description</th>
                                <th style="width: 15%; text-align: center;">Qty</th>
                                <th style="width: 15%; text-align: right;">Price</th>
                                <th style="width: 20%; text-align: right;">Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsHtml}
                        </tbody>
                    </table>
                </div>

                <div class="summary-section">
                    <div class="summary-table">
                        <div class="summary-row">
                            <span>Subtotal:</span>
                            <span>$${subtotal.toFixed(2)}</span>
                        </div>
                        <div class="summary-row">
                            <span>Tax (10%):</span>
                            <span>$${tax.toFixed(2)}</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total Due:</span>
                            <span>$${order.total.toFixed(2)}</span>
                        </div>
                    </div>
                </div>

                <div class="receipt-footer">
                    <p>Thank you for your business!</p>
                    <p style="margin-top: 0.5rem; font-size: 0.8rem;">
                        If you have any questions about this receipt, please contact our support team.
                    </p>
                </div>
            `;

            document.getElementById('receipt').innerHTML = html;
        }

        function downloadPDF() {
            const element = document.getElementById('receipt');
            const opt = {
                margin: 0.5,
                filename: `Receipt-ORD-${orderId}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            // Use html2pdf library
            html2pdf().set(opt).from(element).save();
        }

        // Initialize
        loadReceipt();
    </script>
</body>

</html>
