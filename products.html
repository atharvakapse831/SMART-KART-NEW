<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products — Smart KART</title>
    <meta name="description" content="Browse fresh groceries by category, filter by price, and discover daily deals." />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .page-hero {
            background: linear-gradient(135deg, #0F4C2A, #15803D);
            color: #fff;
            padding: 3rem 0;
            margin-top: var(--nav-h);
        }

        .page-hero h1 {
            font-size: 2rem;
            font-weight: 800;
        }

        .page-hero p {
            opacity: .8;
            margin-top: .5rem;
        }

        .active-filters {
            display: flex;
            gap: .5rem;
            flex-wrap: wrap;
            margin-bottom: 1.25rem;
        }

        .filter-chip {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding: .3rem .85rem;
            background: var(--primary-light);
            color: var(--primary-darker);
            border-radius: var(--r-full);
            font-size: .78rem;
            font-weight: 600;
        }

        .filter-chip button {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: .75rem;
        }

        /* Mobile filter */
        .filter-toggle-btn {
            display: none;
            align-items: center;
            gap: .5rem;
        }

        .filter-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            z-index: 200;
        }

        .filter-overlay.open {
            display: block;
        }

        @media (max-width: 1024px) {
            .filter-toggle-btn {
                display: inline-flex;
            }

            .filters-sidebar {
                position: fixed !important;
                inset: 0 auto 0 0;
                width: min(85vw, 300px);
                z-index: 201;
                transform: translateX(-110%);
                transition: transform .3s cubic-bezier(.4, 0, .2, 1);
                overflow-y: auto;
                border-radius: 0 var(--r-lg) var(--r-lg) 0;
                padding-top: 1rem;
            }

            .filters-sidebar.open {
                transform: translateX(0);
            }

            #filter-close-btn {
                display: inline-flex !important;
            }
        }

        @media (max-width: 480px) {
            .page-hero {
                padding: 2.25rem 0;
            }

            .page-hero h1 {
                font-size: 1.6rem;
            }

            .catalog-toolbar {
                gap: 0.75rem;
            }

            .catalog-toolbar .search-bar,
            .catalog-toolbar .sort-select,
            .catalog-toolbar .filter-toggle-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header id="header">
        <div class="container">
            <nav>
                <a href="index.html" class="logo"><i class="fas fa-shopping-basket"></i> Smart<span>KART</span></a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html" class="active">Products</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
                <div class="nav-actions">
                    <button class="nav-icon" id="theme-toggle"><i class="fas fa-moon"></i></button>
                    <a class="nav-icon" href="wishlist.html"><i class="fas fa-heart"></i></a>
                    <a class="nav-icon" href="cart.html"><i class="fas fa-shopping-cart"></i><span class="badge-dot"
                            id="cart-count" style="display:none">0</span></a>
                    <a href="login.html" class="btn btn-primary btn-sm" id="nav-login">Login</a>
                    <div id="nav-user" style="display:none;align-items:center;gap:.5rem">
                        <span class="user-btn"><i class="fas fa-user-circle"></i> <span
                                id="nav-username">Me</span></span>
                        <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
                    </div>
                    <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
                </div>
            </nav>
        </div>
    </header>
    <nav id="mobile-nav">
        <a href="index.html"><i class="fas fa-home"></i> Home</a>
        <a href="products.html"><i class="fas fa-store"></i> Products</a>
        <a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart</a>
        <a href="orders.html"><i class="fas fa-box"></i> Orders</a>
        <a href="login.html"><i class="fas fa-sign-in-alt"></i> Login</a>
    </nav>

    <main>
        <div class="page-hero">
            <div class="container">
                <h1>All Products</h1>
                <p>Fresh from the farm to your table</p>
            </div>
        </div>

        <div class="container" style="padding-top:2rem;padding-bottom:4rem">
            <!-- Search + Sort bar -->
            <div class="catalog-toolbar"
                style="display:flex;gap:.75rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center">
                <button class="btn btn-ghost filter-toggle-btn" id="filter-toggle-btn" onclick="toggleFilters()">
                    <i class="fas fa-sliders-h"></i> Filters
                </button>
                <div class="search-bar" style="flex:1;min-width:200px">
                    <input type="text" id="search-input" placeholder="Search products..." autocomplete="off" />
                    <button><i class="fas fa-search"></i></button>
                </div>
                <select class="sort-select" id="sort-select">
                    <option value="-created_date">Newest First</option>
                    <option value="product_price">Price: Low → High</option>
                    <option value="-product_price">Price: High → Low</option>
                    <option value="-rating">Top Rated</option>
                    <option value="product_name">A → Z</option>
                </select>
            </div>

            <!-- Filter overlay (mobile) -->
            <div class="filter-overlay" id="filter-overlay" onclick="toggleFilters()"></div>

            <div class="active-filters" id="active-filters"></div>

            <div class="products-layout">
                <!-- Sidebar -->
                <aside class="filters-sidebar" id="filter-sidebar">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem">
                        <strong>Filters</strong>
                        <button class="btn btn-ghost btn-sm filter-toggle-btn" onclick="toggleFilters()"
                            style="display:none" id="filter-close-btn">✕ Close</button>
                    </div>
                    <div class="filter-group">
                        <div class="filter-group-title">Category</div>
                        <div id="cat-filters">
                            <div class="skeleton" style="height:12px;margin-bottom:8px"></div>
                            <div class="skeleton" style="height:12px;margin-bottom:8px"></div>
                            <div class="skeleton" style="height:12px"></div>
                        </div>
                    </div>
                    <div class="filter-group">
                        <div class="filter-group-title">Price Range</div>
                        <div class="price-range-inputs">
                            <input type="number" class="form-control" id="min-price" placeholder="Min" min="0" />
                            <input type="number" class="form-control" id="max-price" placeholder="Max" min="0" />
                        </div>
                        <button class="btn btn-outline btn-sm" style="margin-top:.75rem;width:100%"
                            onclick="applyPriceFilter()">Apply</button>
                    </div>
                    <div class="filter-group">
                        <div class="filter-group-title">Availability</div>
                        <label class="filter-option"><input type="checkbox" id="feat-filter"
                                onchange="loadProducts()" />
                            Featured only</label>
                    </div>
                    <button class="btn btn-ghost btn-sm btn-block" onclick="clearFilters()">Clear All Filters</button>
                </aside>

                <!-- Products Area -->
                <div>
                    <div class="results-bar">
                        <span class="results-count" id="results-count">Loading...</span>
                    </div>
                    <div class="product-grid" id="product-grid">
                        <div class="skeleton-card">
                            <div class="skeleton-img"></div>
                            <div class="skeleton-line"></div>
                            <div class="skeleton-line short"></div>
                        </div>
                        <div class="skeleton-card">
                            <div class="skeleton-img"></div>
                            <div class="skeleton-line"></div>
                            <div class="skeleton-line short"></div>
                        </div>
                        <div class="skeleton-card">
                            <div class="skeleton-img"></div>
                            <div class="skeleton-line"></div>
                            <div class="skeleton-line short"></div>
                        </div>
                        <div class="skeleton-card">
                            <div class="skeleton-img"></div>
                            <div class="skeleton-line"></div>
                            <div class="skeleton-line short"></div>
                        </div>
                    </div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </div>

    </main>
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item"><i class="fas fa-home"></i>Home</a>
        <a href="products.html" class="bottom-nav-item active"><i class="fas fa-store"></i>Shop</a>
        <a href="cart.html" class="bottom-nav-item"><i class="fas fa-shopping-cart"></i>Cart</a>
        <a href="orders.html" class="bottom-nav-item"><i class="fas fa-box"></i>Orders</a>
        <a href="profile.html" class="bottom-nav-item"><i class="fas fa-user"></i>Profile</a>
    </nav>

    <script src="api-service.js"></script>
    <script>
        let currentPage = 1, totalPages = 1;
        let searchTimeout;
        const urlP = new URLSearchParams(window.location.search);

        function toggleFilters() {
            document.getElementById('filter-sidebar').classList.toggle('open');
            document.getElementById('filter-overlay').classList.toggle('open');
            document.body.classList.toggle('nav-open');
        }

        function getFilters() {
            return {
                search: document.getElementById('search-input').value.trim(),
                category: urlP.get('category') || '',
                min_price: document.getElementById('min-price').value,
                max_price: document.getElementById('max-price').value,
                featured: document.getElementById('feat-filter').checked ? '1' : '',
                sort: document.getElementById('sort-select').value,
                page: currentPage,
                page_size: 12
            };
        }

        function productCard(p) {
            const price = p.discount_price
                ? `<span class="product-price">${formatPrice(p.discount_price)}</span> <span class="product-old-price">${formatPrice(p.product_price)}</span>`
                : `<span class="product-price">${formatPrice(p.product_price)}</span>`;
            const badge = p.discount_price ? `<span class="badge badge-orange">${Math.round((p.product_price - p.discount_price) / p.product_price * 100)}% OFF</span>` : '';
            return `<div class="product-card">
    <a href="product-detail.html?id=${p.id}">
      <div class="product-img-wrap">
        <img src="${p.product_image || 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=600&q=80'}" alt="${p.product_name}" loading="lazy"/>
        <div class="product-badges">${badge}${p.is_featured ? '<span class="badge badge-green">Featured</span>' : ''}</div>
      </div>
    </a>
    <div class="product-body">
      <div class="product-cat">${p.category_name || ''}</div>
      <div class="product-name"><a href="product-detail.html?id=${p.id}">${p.product_name}</a></div>
      <div class="product-rating">${renderStars(p.rating)} <span>(${p.review_count})</span></div>
      <div class="product-footer">
        <div class="product-pricing">${price}<div class="product-old-price" style="text-decoration:none;color:var(--text-light)">${p.unit ? p.unit : ''}</div></div>
        <button class="product-add-btn" onclick="addToCart(${p.id},'${p.product_name}')"><i class="fas fa-plus"></i></button>
      </div>
    </div>
  </div>`;
        }

        async function loadProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '<div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>'.repeat(4);
            const filters = getFilters();
            // Remove empty filters
            Object.keys(filters).forEach(k => { if (!filters[k]) delete filters[k]; });
            try {
                const r = await productsAPI.list(filters);
                const prods = r.data || [];
                totalPages = r.pagination?.pages || 1;
                document.getElementById('results-count').textContent = `${r.pagination?.total || 0} products found`;
                grid.innerHTML = prods.length ? prods.map(productCard).join('') : '<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-search"></i><h3>No products found</h3><p>Try adjusting your filters</p></div>';
                renderPagination();
                updateActiveFilters(filters);
            } catch (e) {
                grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-exclamation-circle"></i><h3>Could not load products</h3><p>${e.message}</p></div>`;
            }
        }

        function renderPagination() {
            const el = document.getElementById('pagination');
            if (totalPages <= 1) { el.innerHTML = ''; return; }
            let html = `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})"><i class="fas fa-chevron-left"></i></button>`;
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 1) html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
                else if (Math.abs(i - currentPage) === 2) html += '<span style="padding:.5rem">…</span>';
            }
            html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})"><i class="fas fa-chevron-right"></i></button>`;
            el.innerHTML = html;
        }
        function goPage(p) { currentPage = p; loadProducts(); window.scrollTo(0, 0); }

        function updateActiveFilters(f) {
            const el = document.getElementById('active-filters');
            let chips = '';
            if (f.category) chips += `<span class="filter-chip">${f.category} <button onclick="clearCat()">×</button></span>`;
            if (f.search) chips += `<span class="filter-chip">Search: ${f.search} <button onclick="clearSearch()">×</button></span>`;
            if (f.featured) chips += `<span class="filter-chip">Featured <button onclick="clearFeat()">×</button></span>`;
            el.innerHTML = chips;
        }
        function clearCat() { urlP.delete('category'); loadProducts(); }
        function clearSearch() { document.getElementById('search-input').value = ''; loadProducts(); }
        function clearFeat() { document.getElementById('feat-filter').checked = false; loadProducts(); }
        function clearFilters() { clearCat(); clearSearch(); clearFeat(); document.getElementById('min-price').value = ''; document.getElementById('max-price').value = ''; loadProducts(); }
        function applyPriceFilter() { currentPage = 1; loadProducts(); }

        async function loadCategories() {
            try {
                const r = await productsAPI.cats();
                const ICONS = { Fruits: '🍎', Vegetables: '🥕', Dairy: '🧀', Meat: '🍗', Bakery: '🍞', Grains: '🌾' };
                document.getElementById('cat-filters').innerHTML = (r.data || []).map(c =>
                    `<label class="filter-option">
        <input type="radio" name="cat" value="${c.category_name}" ${urlP.get('category') === c.category_name ? 'checked' : ''} onchange="selectCat('${c.category_name}')"/>
        ${ICONS[c.category_name] || '📦'} ${c.category_name} <small style="color:var(--text-light)">(${c.product_count})</small>
      </label>`).join('')
                    + `<label class="filter-option"><input type="radio" name="cat" value="" ${!urlP.get('category') ? 'checked' : ''} onchange="clearCat()"/> All Categories</label>`;
            } catch { }
        }
        function selectCat(cat) { urlP.set('category', cat); currentPage = 1; loadProducts(); }

        async function addToCart(id, name) {
            if (!Auth.isLoggedIn()) { showToast('Please log in to add to cart', 'warning'); return; }
            try { await cartAPI.add(id, 1); showToast(`${name} added!`, 'success'); refreshCartCount(); }
            catch (e) { showToast(e.message, 'error'); }
        }

        // Pre-fill search from URL
        if (urlP.get('search')) document.getElementById('search-input').value = urlP.get('search');
        if (urlP.get('featured')) document.getElementById('feat-filter').checked = true;

        document.getElementById('search-input').addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => { currentPage = 1; loadProducts(); }, 450);
        });
        document.getElementById('sort-select').addEventListener('change', () => { currentPage = 1; loadProducts(); });

        loadCategories();
        loadProducts();
    </script>
</body>

</html>
