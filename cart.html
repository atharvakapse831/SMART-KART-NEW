<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Cart — Smart KART</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
    <header id="header">
        <div class="container">
            <nav>
                <a href="index.html" class="logo"><i class="fas fa-shopping-basket"></i> Smart<span>KART</span></a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                </ul>
                <div class="nav-actions">
                    <button class="nav-icon" id="theme-toggle"><i class="fas fa-moon"></i></button>
                    <a class="nav-icon" href="cart.html"><i class="fas fa-shopping-cart"></i><span class="badge-dot"
                            id="cart-count" style="display:none">0</span></a>
                    <a href="login.html" class="btn btn-primary btn-sm" id="nav-login">Login</a>
                    <div id="nav-user" style="display:none;align-items:center;gap:.5rem">
                        <span class="user-btn"><i class="fas fa-user-circle"></i> <span
                                id="nav-username">Me</span></span>
                        <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
                    </div>
                    <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
                </div>
            </nav>
        </div>
    </header>
    <nav id="mobile-nav">
        <a href="index.html"><i class="fas fa-home"></i> Home</a>
        <a href="products.html"><i class="fas fa-store"></i> Products</a>
        <a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart</a>
    </nav>

    <main>
        <div class="container page-top">
            <div class="section-top" style="margin-bottom:2rem">
                <h1 class="section-title" style="font-size:2rem">My Cart</h1>
                <button class="btn btn-ghost btn-sm" onclick="clearCart()"><i class="fas fa-trash"></i> Clear</button>
            </div>

            <!-- Not logged in -->
            <div id="guest-msg" style="display:none" class="card card-body" style="text-align:center">
                <div class="empty-state"><i class="fas fa-lock"></i>
                    <h3>Login to view your cart</h3>
                    <p>Server-side cart requires an account.</p>
                    <a href="login.html" class="btn btn-primary" style="margin-top:1rem">Login / Sign Up</a>
                </div>
            </div>

            <!-- Cart layout -->
            <div class="cart-layout" id="cart-main" style="display:none">
                <div>
                    <div class="card" id="cart-items-box">
                        <div id="cart-items-list"></div>
                    </div>
                </div>
                <div class="cart-summary">
                    <h3>Order Summary</h3>
                    <div class="summary-row"><span>Subtotal</span><span id="sum-subtotal">₹0.00</span></div>
                    <div class="summary-row discount" id="sum-discount-row" style="display:none">
                        <span>Discount</span><span id="sum-discount">- ₹0.00</span>
                    </div>
                    <div class="summary-row"><span>Delivery</span><span id="sum-delivery">Free</span></div>
                    <div class="summary-row total"><span>Total</span><span id="sum-total">₹0.00</span></div>
                    <!-- Coupon -->
                    <div class="coupon-input">
                        <input class="form-control" type="text" id="coupon-code" placeholder="Coupon code" />
                        <button class="btn btn-outline btn-sm" onclick="applyCoupon()">Apply</button>
                    </div>
                    <div id="coupon-msg" style="font-size:.8rem;margin-bottom:.75rem"></div>
                    <a href="checkout.html" class="btn btn-primary btn-block" id="checkout-btn"><i
                            class="fas fa-lock"></i>
                        Proceed to Checkout</a>
                    <a href="products.html" class="btn btn-ghost btn-block" style="margin-top:.75rem"><i
                            class="fas fa-arrow-left"></i> Continue Shopping</a>
                </div>
            </div>
        </div>

    </main>
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item"><i class="fas fa-home"></i>Home</a>
        <a href="products.html" class="bottom-nav-item"><i class="fas fa-store"></i>Shop</a>
        <a href="cart.html" class="bottom-nav-item active"><i class="fas fa-shopping-cart"></i>Cart</a>
        <a href="orders.html" class="bottom-nav-item"><i class="fas fa-box"></i>Orders</a>
        <a href="profile.html" class="bottom-nav-item"><i class="fas fa-user"></i>Profile</a>
    </nav>

    <script src="api-service.js"></script>
    <script>
        let cartItems = [];
        let couponDiscount = 0;
        const DELIVERY_FEE = 0; // free delivery

        async function loadCart() {
            if (!Auth.isLoggedIn()) {
                document.getElementById('guest-msg').style.display = 'block';
                return;
            }
            document.getElementById('cart-main').style.display = 'grid';
            try {
                const r = await cartAPI.get();
                cartItems = r.data || [];
                renderCart();
            } catch (e) { showToast(e.message, 'error'); }
        }

        function renderCart() {
            const el = document.getElementById('cart-items-list');
            if (!cartItems.length) {
                document.getElementById('cart-main').style.display = 'none';
                document.getElementById('guest-msg').style.display = 'block';
                document.getElementById('guest-msg').innerHTML = `<div class="empty-state"><i class="fas fa-shopping-cart"></i><h3>Your cart is empty</h3><p>Looks like you haven't added anything yet.</p><a href="products.html" class="btn btn-primary" style="margin-top:1rem">Browse Products</a></div>`;
                return;
            }
            el.innerHTML = cartItems.map(item => {
                const eff = item.discount_price || item.product_price;
                return `<div class="cart-item" id="ci-${item.id}">
      <img class="cart-item-img" src="${item.product_image || 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=200&q=80'}" alt="${item.product_name}"/>
      <div class="cart-item-info">
        <div class="cart-item-cat">${item.category_name || ''}</div>
        <div class="cart-item-name"><a href="product-detail.html?id=${item.product}">${item.product_name}</a></div>
        <div class="cart-item-price">${formatPrice(eff)} ${item.unit ? '/ ' + item.unit : ''}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:.75rem">
        <div class="qty-control">
          <button class="qty-btn" onclick="updateQty(${item.id}, ${item.quantity - 1})"><i class="fas fa-minus"></i></button>
          <span class="qty-val">${item.quantity}</span>
          <button class="qty-btn" onclick="updateQty(${item.id}, ${item.quantity + 1})"><i class="fas fa-plus"></i></button>
        </div>
        <strong>${formatPrice(parseFloat(eff) * item.quantity)}</strong>
        <button class="btn btn-danger btn-sm" onclick="removeItem(${item.id})"><i class="fas fa-trash"></i></button>
      </div>
    </div>`;
            }).join('');
            updateSummary();
        }

        function updateSummary() {
            let sub = cartItems.reduce((s, i) => s + parseFloat(i.discount_price || i.product_price) * i.quantity, 0);
            document.getElementById('sum-subtotal').textContent = formatPrice(sub);
            if (couponDiscount > 0) {
                document.getElementById('sum-discount-row').style.display = 'flex';
                document.getElementById('sum-discount').textContent = `- ${formatPrice(couponDiscount)}`;
            }
            const total = Math.max(sub - couponDiscount, 0);
            document.getElementById('sum-total').textContent = formatPrice(total);
            // Store in session for checkout  
            localStorage.setItem('sk_cart_total', total);
            localStorage.setItem('sk_cart_sub', sub);
            localStorage.setItem('sk_cart_discount', couponDiscount);
            localStorage.setItem('sk_coupon_code', document.getElementById('coupon-code').value.toUpperCase());
        }

        async function updateQty(id, qty) {
            if (qty <= 0) { removeItem(id); return; }
            try {
                await cartAPI.update(id, qty);
                const item = cartItems.find(i => i.id === id);
                if (item) { item.quantity = qty; renderCart(); refreshCartCount(); }
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function removeItem(id) {
            try {
                await cartAPI.remove(id);
                cartItems = cartItems.filter(i => i.id !== id);
                renderCart(); refreshCartCount();
                showToast('Item removed', 'info');
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function clearCart() {
            if (!confirm('Clear all cart items?')) return;
            try { await cartAPI.clear(); cartItems = []; renderCart(); refreshCartCount(); showToast('Cart cleared', 'info'); }
            catch (e) { showToast(e.message, 'error'); }
        }

        async function applyCoupon() {
            const code = document.getElementById('coupon-code').value.trim().toUpperCase();
            const msg = document.getElementById('coupon-msg');
            if (!code) { showToast('Enter a coupon code', 'warning'); return; }
            const sub = cartItems.reduce((s, i) => s + parseFloat(i.discount_price || i.product_price) * i.quantity, 0);
            try {
                const r = await ordersAPI.coupon(code, sub);
                couponDiscount = r.discount;
                msg.innerHTML = `<span style="color:var(--primary)">✅ Saved ${formatPrice(couponDiscount)} with code <strong>${code}</strong></span>`;
                updateSummary();
            } catch (e) {
                msg.innerHTML = `<span style="color:#EF4444">❌ ${e.message}</span>`;
                couponDiscount = 0; updateSummary();
            }
        }

        loadCart();
    </script>
</body>

</html>
